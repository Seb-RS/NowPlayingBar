name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publicar NowPlayingBar
        run: dotnet publish NowPlayingBar/NowPlayingBar.csproj -c Release -o dist/NowPlayingBar

      - name: Publicar NowPlayingWidget
        run: dotnet publish NowPlayingWidget/NowPlayingWidget.csproj -c Release -r win-x64 -o dist/NowPlayingWidget

      - name: Comprimir
        shell: pwsh
        run: |
          Compress-Archive dist/NowPlayingBar/* NowPlayingBar.zip
          Compress-Archive dist/NowPlayingWidget/* NowPlayingWidget.zip

      - name: Subir artefacto
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NowPlayingBar-unsigned
          path: |
            NowPlayingBar.zip
            NowPlayingWidget.zip

      # Firma con SignPath: se activa cuando el proyecto sea aprobado por SignPath Foundation.
      # Requiere el secreto SIGNPATH_API_TOKEN y la variable SIGNPATH_ORGANIZATION_ID en el repo.
      - name: Firmar con SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: NowPlayingBar
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Crear release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'signed/*.zip' || '*.zip' }}
