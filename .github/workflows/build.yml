name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publicar NowPlayingBar
        # Autocontenido: no requiere instalar .NET en el PC del usuario
        run: dotnet publish NowPlayingBar/NowPlayingBar.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist/NowPlayingBar

      - name: Publicar NowPlayingWidget
        run: dotnet publish NowPlayingWidget/NowPlayingWidget.csproj -c Release -r win-x64 -o dist/NowPlayingWidget

      - name: Crear instalador
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          $v = if ($env:GITHUB_REF -like 'refs/tags/v*') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" installer/NowPlayingBar.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item dist/NowPlayingBar-Setup-*.exe .

      - name: Comprimir
        shell: pwsh
        run: |
          Compress-Archive dist/NowPlayingBar/* NowPlayingBar.zip
          Compress-Archive dist/NowPlayingWidget/* NowPlayingWidget.zip

      - name: Subir artefacto
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: NowPlayingBar-unsigned
          path: |
            NowPlayingBar-Setup-*.exe
            NowPlayingBar.zip
            NowPlayingWidget.zip

      # Firma con SignPath: se activa cuando el proyecto sea aprobado por SignPath Foundation.
      # Requiere el secreto SIGNPATH_API_TOKEN y la variable SIGNPATH_ORGANIZATION_ID en el repo.
      - name: Firmar con SignPath
        if: startsWith(github.ref, 'refs/tags/v') && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: NowPlayingBar
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Crear release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: NowPlayingBar ${{ github.ref_name }}
          # Notas de la versión: release-notes/vX.Y.Z.md (si existe)
          body_path: ${{ hashFiles(format('release-notes/{0}.md', github.ref_name)) != '' && format('release-notes/{0}.md', github.ref_name) || '' }}
          files: |
            ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && 'signed/*' || '*.zip' }}
            ${{ vars.SIGNPATH_ORGANIZATION_ID == '' && 'NowPlayingBar-Setup-*.exe' || '' }}
